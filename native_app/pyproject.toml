[project]
name = "reachy-mini-reception-app"
version = "0.1.2"
description = "Native Reception lifecycle client for the m1max reception service"
requires-python = ">=3.11,<3.13"
dependencies = ["reachy-mini==1.10.0", "websockets>=15.0.1,<16"]

[project.entry-points."reachy_mini_apps"]
reachy_mini_reception_app = "reachy_mini_reception_app.main:ReceptionApp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../src/reachy_mini_reception_app" = "reachy_mini_reception_app"
